name: Apply retry UI fix

on:
  push:
    branches:
      - agent/retry-failed-pdfs-before-download

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/retry-failed-pdfs-before-download

      - name: Patch Streamlit refresh after processing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app.py")
          text = path.read_text(encoding="utf-8")

          old = '''    lote_ejecutado_en_esta_corrida = True
    ultimo_lote = st.session_state.get("ultimo_lote")

if 'reintentar_click' in locals() and reintentar_click:
'''

          new = '''    lote_ejecutado_en_esta_corrida = True
    ultimo_lote = st.session_state.get("ultimo_lote")

    # El panel de reintento se construye antes de ejecutar el lote. Al finalizar,
    # session_state ya contiene los errores, pero la interfaz necesita un nuevo
    # ciclo de Streamlit para mostrarlos sin depender de un clic de descarga.
    reiniciar_app_streamlit()

if 'reintentar_click' in locals() and reintentar_click:
'''

          if new in text:
              raise SystemExit("The retry UI refresh fix is already present.")
          if old not in text:
              raise SystemExit("Expected processing completion block was not found; no file was changed.")

          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Validate Python syntax
        run: python -m py_compile app.py

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Show retry controls immediately after processing"
          git push origin HEAD:agent/retry-failed-pdfs-before-download
