name: Homcloud integrity and recovery tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile application modules
        run: |
          python -m compileall -q app.py app_core.py preferencias_motor.py openrouter_cliente.py diagnostico_openrouter_terminal.py diagnostico_openrouter_batch.py opencode_compat.py diagnostico_opencode.py pages/04_Diagnostico_OpenCode.py pages/05_Programas_y_planes.py pages/06_Configuracion_operativa.py historial_homologaciones.py pages/03_Historial_homologaciones.py configuracion_global.py configuracion_tabla.py pdf_enlaces.py operativa_compartida.py excepciones_cloudshell.py recuperacion_lotes.py retencion_local.py pages/02_Recuperar_resultados.py
      - name: Run pure-Python tests (no credentials or APIs)
        run: |
          python -m unittest test_preferencias_motor test_openrouter_cliente test_diagnostico_openrouter_terminal test_diagnostico_openrouter_batch test_excel_runtime_patch test_opencode_compat test_diagnostico_opencode test_historial_homologaciones test_configuracion_tabla test_pdf_enlaces test_configuracion_global test_operativa_compartida test_recuperacion_lotes test_integridad_app -v
